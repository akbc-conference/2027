title: "AKBC 2026"

credits: '<p>Created with &hearts; by <a href="http://phlow.de/">Phlow</a> with <a href="http://jekyllrb.com/" target="_blank">Jekyll</a> based on <a href="http://phlow.github.io/feeling-responsive/">Feeling Responsive</a>.</p>'

url: "https://akbc.ws"
baseurl: "/2026"

logo: "akbc_logo.png"

plugins:
  - jekyll-asciidoc
  - jekyll-gist
  - jekyll-paginate
  - jekyll-redirect-from

markdown: kramdown
permalink: /:categories/:title/
highlight: rouge
excerpt_separator: "<!--more-->"
include: [".htaccess"]

exclude:
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - INSTALL.md
  - CLAUDE.md

language: "en"

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  profile: false
  ignore:
    envs: [development]

sass:
  sass_dir: _sass
  style: :compressed
